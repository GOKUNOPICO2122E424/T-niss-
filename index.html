<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>T-Niss</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500..700;1,500..700&family=Jost:wght@400;500;600;700&display=swap">
<style id="app-style">
/* Layout: marcador deportivo. Bloques anchos, rotulos condensados en cursiva con corte inclinado, lineas de cancha como filigrana. Una sola atmosfera oscura con el rojo de la marca. */
:root{
  --bg:#0d0e11; --surface:#15171c; --raised:#1d2027; --line:#2b2f38;
  --chalk:#f4f3ef; --mute:#a0a6b3; --red:#d4287c; --red-hot:#ff5fae; --red-deep:#8a1a52;
  --ok:#35d07f; --warn:#f2b84b;
  --display:'Archivo','Arial Narrow','Impact',system-ui,sans-serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth;scroll-padding-top:76px}
html.lock{overflow:hidden}
body{background:var(--bg);color:var(--chalk);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;margin:0;min-width:0}
img{display:block;max-width:100%}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--red-hot);outline-offset:3px}
.wrap{width:100%;max-width:1240px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.disp{font-family:var(--display);font-stretch:68%;font-weight:850;font-style:italic;text-transform:uppercase;letter-spacing:.005em;line-height:.9}
.eyebrow{font-size:.78rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--red-hot);margin:0 0 10px}
h1,h2,h3{margin:0;text-wrap:balance}
h2{font-size:clamp(2.4rem,7vw,4rem)}
p{margin:0}
.mute{color:var(--mute)}

/* botones con borde inclinado */
.btn{position:relative;isolation:isolate;display:inline-flex;align-items:center;justify-content:center;gap:.5em;min-height:50px;padding:.8rem 1.7rem;font-weight:700;font-size:1rem;letter-spacing:.02em;text-decoration:none;color:#fff;white-space:nowrap}
.btn::before{content:'';position:absolute;inset:0;z-index:-1;background:var(--red);transform:skewX(-12deg);border-radius:3px;transition:background .18s,transform .18s}
.btn:hover::before{background:var(--red-hot);transform:skewX(-12deg) translateY(-2px)}
.btn-ghost::before{background:transparent;box-shadow:inset 0 0 0 2px var(--chalk)}
.btn-ghost:hover::before{background:rgba(255,255,255,.1)}
.btn-wa::before{background:#17a35a}
.btn-wa:hover::before{background:#1fbf6c}
.btn-sm{min-height:42px;padding:.55rem 1.2rem;font-size:.92rem}
.btn-line{border:1px solid var(--line);border-radius:6px;padding:.6rem 1rem;font-weight:600;background:var(--raised)}
.btn-line:hover{border-color:var(--mute)}
.btn-line.sm{padding:.45rem .8rem;font-size:.88rem}
.btn-danger{border-color:var(--red-deep);color:var(--red-hot)}
.ico{width:1.15em;height:1.15em;flex:none}

/* cabecera */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:color-mix(in srgb,var(--bg) 90%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hdr .wrap{display:flex;align-items:center;gap:20px;height:64px}
.logo{font-family:var(--display);font-stretch:68%;font-weight:850;font-style:italic;text-transform:uppercase;font-size:1.9rem;line-height:1;text-decoration:none;display:flex;align-items:baseline;gap:.22em;margin-right:auto}
.logo b{color:var(--red-hot)}
.nav{display:none;gap:26px}
.nav a{font-weight:600;font-size:.95rem;text-decoration:none;color:var(--mute);padding:6px 0;border-bottom:2px solid transparent}
.nav a:hover{color:var(--chalk);border-color:var(--red)}
.burger{width:44px;height:44px;display:grid;place-content:center;gap:5px}
.burger i{display:block;width:24px;height:2px;background:var(--chalk)}
.menu{border-top:1px solid var(--line);background:var(--bg);padding:8px max(16px,env(safe-area-inset-right,0px)) 18px max(16px,env(safe-area-inset-left,0px));display:grid}
.menu a{padding:14px 0;border-bottom:1px solid var(--line);font-family:var(--display);font-stretch:68%;font-weight:800;font-style:italic;text-transform:uppercase;font-size:1.7rem;text-decoration:none}
.menu .row{display:flex;gap:10px;padding-top:16px}
.hide-s{display:none}
@media (min-width:560px){.hide-s{display:inline-flex}}
@media (min-width:920px){.nav{display:flex}.burger,.menu{display:none!important}}

/* inicio */
.hero{position:relative;overflow:hidden;border-bottom:1px solid var(--line);background:radial-gradient(70% 90% at 85% 40%,rgba(212,40,124,.22),transparent 65%)}
.hero-grid{display:grid;gap:28px;padding-block:34px 48px}
.kicker{display:inline-flex;align-items:center;gap:10px;font-size:.8rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.kicker::before{content:'';width:28px;height:3px;background:var(--red);transform:skewX(-30deg)}
.hero h1{font-size:clamp(3.6rem,17vw,8.4rem);margin:14px 0 18px}
.hero h1 span{display:block}
.hero h1 .l2{color:var(--red-hot)}
.lead{font-size:1.1rem;max-width:34ch;color:#d9d8d3}
.cta-row{display:flex;flex-wrap:wrap;gap:14px 16px;margin-top:26px}
.facts{list-style:none;padding:0;margin:30px 0 0;display:grid;gap:10px;font-size:.92rem;color:var(--mute)}
.facts li{display:flex;gap:10px;align-items:center}
.facts li::before{content:'';width:8px;height:8px;background:var(--red);transform:skewX(-20deg);flex:none}
.hero-art{position:relative;width:100%;max-width:640px;aspect-ratio:6/5;justify-self:center}
.pitch{position:absolute;inset:0;width:100%;height:100%;color:rgba(255,255,255,.13)}
.pitch .hot{stroke:var(--red-hot);stroke-dasharray:540;stroke-dashoffset:0}
.hero-boot{position:absolute;left:50%;top:50%;width:92%;transform:translate(-50%,-50%) rotate(-9deg);filter:drop-shadow(0 26px 30px rgba(0,0,0,.55));--b-up:var(--red);--b-acc:#fff;--b-inner:#190a0b;--b-lace:#fff}
.hero-photo{position:absolute;inset:6% 4%;object-fit:cover;width:92%;height:88%;border-radius:4px;border:1px solid var(--line)}
.pricechip{position:absolute;right:2%;bottom:6%;background:var(--chalk);color:#0d0e11;padding:10px 18px 10px 14px;clip-path:polygon(10px 0,100% 0,100% 100%,0 100%);font-weight:700;line-height:1.1}
.pricechip small{display:block;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:#555}
.pricechip b{font-family:var(--display);font-stretch:70%;font-style:italic;font-weight:850;font-size:1.7rem}
@media (min-width:920px){.hero-grid{grid-template-columns:1.05fr .95fr;align-items:center;padding-block:56px 72px;gap:40px}}
@media (prefers-reduced-motion:no-preference){
  .hero-boot{animation:bootin .9s cubic-bezier(.2,.8,.2,1) both,bootfloat 6s ease-in-out .9s infinite}
  .pitch .hot{animation:draw 1.5s ease-out both}
}
@keyframes bootin{from{opacity:0;transform:translate(-80%,-50%) rotate(-16deg)}to{opacity:1;transform:translate(-50%,-50%) rotate(-9deg)}}
@keyframes bootfloat{0%,100%{transform:translate(-50%,-50%) rotate(-9deg)}50%{transform:translate(-50%,-53%) rotate(-7.5deg)}}
@keyframes draw{from{stroke-dashoffset:540}to{stroke-dashoffset:0}}

/* cinta */
.ticker{background:var(--red);color:#fff;overflow:hidden;white-space:nowrap}
.track{display:inline-flex;animation:slide 34s linear infinite;will-change:transform}
.track span{font-family:var(--display);font-stretch:68%;font-weight:800;font-style:italic;text-transform:uppercase;font-size:1.15rem;padding:11px 0;display:inline-flex;align-items:center}
.track span::after{content:'/';margin:0 22px;opacity:.55}
@keyframes slide{to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.track,.brands .track{animation-duration:90s}}

section.sec{padding-block:56px}
.sec-h{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:26px}
.sec-h p.mute{max-width:46ch;margin-top:10px}
.rail-btns{display:none;gap:10px}
.rail-btns button{width:46px;height:46px;border:1px solid var(--line);display:grid;place-items:center;font-size:1.2rem;background:var(--surface)}
.rail-btns button:hover{background:var(--red);border-color:var(--red)}
@media (min-width:760px){.rail-btns{display:flex}}
.rail{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:14px;scrollbar-width:thin;scrollbar-color:var(--line) transparent;-webkit-overflow-scrolling:touch}
.rail>*{flex:0 0 min(72vw,280px);scroll-snap-align:start}

/* tarjetas de producto */
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:3px;display:flex;flex-direction:column;min-width:0;transition:border-color .2s,transform .2s}
.card::after{content:'';position:absolute;left:0;bottom:-1px;height:3px;width:0;background:var(--red);transition:width .3s}
.card:hover{border-color:#3d424e}
.card:hover::after{width:100%}
.cmedia{position:relative;display:block;width:100%;aspect-ratio:4/5;overflow:hidden;background:var(--raised);text-align:left}
.cmedia img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.card:hover .cmedia img{transform:scale(1.04)}
.ph{position:absolute;inset:0;display:grid;place-items:center;overflow:hidden;background:radial-gradient(90% 70% at 30% 25%,hsl(var(--h) 70% 30%/.85),transparent 70%),linear-gradient(160deg,var(--raised),var(--surface));--b-up:hsl(var(--h) 72% 50%);--b-acc:rgba(255,255,255,.92);--b-inner:#07080a;--b-lace:#fff}
.ph .boot{width:86%;transform:rotate(-8deg);filter:drop-shadow(0 14px 14px rgba(0,0,0,.5))}
.ph.mini .boot{width:90%}
.tag{position:absolute;left:0;top:12px;background:var(--red);color:#fff;font-size:.7rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;padding:.42rem .9rem .42rem .65rem;clip-path:polygon(0 0,100% 0,calc(100% - 9px) 100%,0 100%);z-index:2}
.soldov{position:absolute;inset:0;background:rgba(13,14,17,.66);display:grid;place-items:center;z-index:2;font-family:var(--display);font-stretch:68%;font-weight:850;font-style:italic;text-transform:uppercase;font-size:1.6rem;letter-spacing:.04em}
.cbody{padding:14px 14px 16px;display:flex;flex-direction:column;gap:4px;flex:1}
.cbrand{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--mute)}
.cname{font-size:1.02rem;font-weight:700;line-height:1.25;text-wrap:balance}
.cmeta{font-size:.82rem;color:var(--mute)}
.cfoot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:auto;padding-top:12px;flex-wrap:wrap}
.price{font-family:var(--display);font-stretch:72%;font-style:italic;font-weight:850;font-size:1.6rem;line-height:1;font-variant-numeric:tabular-nums}
.price s{font-family:var(--body);font-style:normal;font-weight:500;font-size:.85rem;color:var(--mute);margin-left:6px}

/* secciones */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{position:relative;overflow:hidden;min-height:150px;padding:16px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:3px;transition:background .25s,border-color .25s}
.tile:hover{background:var(--red);border-color:var(--red)}
.tile .cnt{font-size:.78rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.tile:hover .cnt,.tile:hover .tb{color:#fff}
.tile .tn{font-size:clamp(1.9rem,6vw,2.8rem);position:relative;z-index:1}
.tile .tb{font-size:.84rem;color:var(--mute);margin-top:6px;position:relative;z-index:1;max-width:24ch}
.tile .tboot{position:absolute;right:-18px;bottom:-14px;width:62%;opacity:.14;transform:rotate(-8deg);--b-up:#fff;--b-acc:#fff;--b-inner:#fff;--b-lace:#fff}
@media (min-width:760px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.tile{min-height:210px;padding:22px}}

/* marcas */
.brands{border-block:1px solid var(--line);overflow:hidden;white-space:nowrap;background:var(--surface)}
.brands .track{animation-duration:46s}
.brands .track span{font-size:clamp(2rem,6vw,3.4rem);color:transparent;-webkit-text-stroke:1px #6c7280;padding:16px 0}
.brands .track span::after{color:var(--red);-webkit-text-stroke:0;opacity:1}

/* catalogo */
.shop{display:grid;gap:22px}
.toolbar{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;margin-bottom:6px}
.field{background:var(--raised);border:1px solid var(--line);border-radius:6px;padding:.72rem .9rem;width:100%;min-width:0}
.field:focus{border-color:var(--red-hot);outline:none}
.toolbar .search{grid-column:1/-1}
.toolbar .count{font-size:.9rem;color:var(--mute)}
.fbtn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--raised);padding:.7rem 1rem;border-radius:6px;font-weight:600}
.fbtn em{font-style:normal;background:var(--red);color:#fff;font-size:.74rem;min-width:20px;height:20px;border-radius:10px;display:grid;place-items:center;padding:0 5px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.filters h3{font-size:.76rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin:20px 0 10px;font-family:var(--body);font-style:normal;font-weight:700}
.filters h3:first-of-type{margin-top:4px}
.fhead{display:flex;justify-content:space-between;align-items:center}
.fhead .disp{font-size:2rem}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--raised);padding:.5rem .85rem;border-radius:4px;font-size:.92rem;font-weight:600;min-height:40px}
.chip:hover{border-color:var(--mute)}
.chip.on{background:var(--red);border-color:var(--red);color:#fff}
.chip.sz{min-width:50px;text-align:center;padding-inline:.5rem}
.range{width:100%;accent-color:var(--red)}
.rv{display:flex;justify-content:space-between;font-size:.9rem;color:var(--mute);margin-top:4px}
.check{display:flex;gap:10px;align-items:center;margin-top:18px;font-weight:600}
.check input{width:20px;height:20px;accent-color:var(--red)}
.fact{display:grid;gap:10px;margin-top:22px}
.scrim{position:fixed;inset:0;background:rgba(5,6,8,.7);z-index:55}
.empty{grid-column:1/-1;border:1px dashed var(--line);padding:40px 20px;text-align:center;display:grid;gap:14px;justify-items:center}
.empty .disp{font-size:2rem}
@media (max-width:959px){
  .filters{position:fixed;left:0;right:0;bottom:0;z-index:60;max-height:84dvh;max-height:84vh;overflow:auto;background:var(--surface);border-top:3px solid var(--red);padding:18px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));transform:translateY(105%);transition:transform .28s;visibility:hidden}
  .filters.open{transform:none;visibility:visible}
}
@media (min-width:960px){
  .shop{grid-template-columns:250px minmax(0,1fr);gap:34px}
  .shop>div{grid-column:2;grid-row:1;min-width:0}
  .filters{grid-column:1;grid-row:1;position:sticky;top:84px;align-self:start;max-height:calc(100vh - 100px);overflow:auto;padding-right:6px}
  .fbtn,.fhead .x,.mres,#fscrim{display:none!important}
  .toolbar{grid-template-columns:1fr 220px auto}
  .toolbar .search{grid-column:auto}
  .grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
}
@media (min-width:720px) and (max-width:959px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.toolbar{grid-template-columns:1fr 200px auto}.toolbar .search{grid-column:auto}}

/* la casa */
.casa{background:var(--surface);border-block:1px solid var(--line)}
.casa-grid{display:grid;gap:34px;align-items:center}
.casa h2{margin-bottom:18px}
.casa .body{font-size:1.08rem;color:#d9d8d3;max-width:46ch}
.stats{display:grid;grid-template-columns:repeat(3,1fr);margin-top:30px;border-top:1px solid var(--line)}
.stat{padding:18px 8px 0 0}
.stat .num{font-family:var(--display);font-stretch:68%;font-weight:850;font-style:italic;font-size:clamp(2.8rem,10vw,4.4rem);line-height:1;color:var(--red-hot);font-variant-numeric:tabular-nums}
.stat span{display:block;font-size:.82rem;color:var(--mute);margin-top:4px}
.photos{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
.photo{position:relative;aspect-ratio:4/5;overflow:hidden;background:var(--raised);border:1px solid var(--line)}
.photo img{width:100%;height:100%;object-fit:cover}
.photo:nth-child(2){margin-top:38px}
.photo .ph{--h:352}
@media (min-width:920px){.casa-grid{grid-template-columns:1fr 1fr;gap:64px}}

/* pedidos */
.steps{display:grid;gap:14px;counter-reset:s}
.step{position:relative;border:1px solid var(--line);background:var(--surface);padding:22px 20px 22px 20px;border-radius:3px}
.step .n{font-family:var(--display);font-stretch:68%;font-weight:850;font-style:italic;font-size:4rem;line-height:.8;color:var(--red-hot)}
.step h3{font-size:1.2rem;font-family:var(--body);font-style:normal;font-weight:700;margin:14px 0 6px}
.step p{color:var(--mute);font-size:.96rem}
@media (min-width:760px){.steps{grid-template-columns:repeat(3,1fr);gap:16px}}
.cta-band{margin-top:34px;background:var(--red);padding:30px 22px;display:grid;gap:18px;border-radius:3px;position:relative;overflow:hidden}
.cta-band h3{font-size:clamp(2rem,6vw,3rem)}
.cta-band p{max-width:44ch;color:#ffe9ea}
.cta-band .btn::before{background:#0d0e11}
.cta-band .btn:hover::before{background:#000}
.cta-band .btn-ghost::before{background:transparent;box-shadow:inset 0 0 0 2px #fff}
@media (min-width:760px){.cta-band{grid-template-columns:1fr auto;align-items:center;padding:38px 40px}}

/* pie */
.foot{border-top:1px solid var(--line);padding-block:44px calc(110px + env(safe-area-inset-bottom,0px));background:var(--bg)}
.foot-grid{display:grid;gap:30px}
.foot h4{font-size:.76rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin:0 0 12px}
.foot ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.foot a{text-decoration:none}
.foot a:hover{color:var(--red-hot)}
.foot .big{font-size:clamp(3.4rem,15vw,7rem);color:#1d2027;margin-top:36px;user-select:none}
.foot small{color:var(--mute)}
.admlink{color:var(--mute);text-align:left}
.admlink:hover{color:var(--chalk)}
@media (min-width:760px){.foot-grid{grid-template-columns:1.4fr 1fr 1fr 1fr}}

/* boton flotante */
.fab{position:fixed;right:0;bottom:0;z-index:50;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) 14px}
.fab .btn{box-shadow:0 10px 28px rgba(0,0,0,.5)}
.editfab{position:fixed;left:0;bottom:0;z-index:50;padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.editfab button{background:var(--chalk);color:#0d0e11;font-weight:700;padding:.75rem 1.1rem;border-radius:4px;box-shadow:0 10px 28px rgba(0,0,0,.5);min-height:46px}
.draftbar{background:var(--warn);color:#17120a;font-weight:600;font-size:.92rem}
.draftbar .wrap{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding-block:10px}
.draftbar button{background:#17120a;color:#fff;padding:.5rem .9rem;border-radius:4px;font-weight:700}

/* ventanas */
.ov{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.ov .scrim{z-index:0}
.dlg{position:relative;z-index:1;width:min(940px,100%);max-height:calc(100vh - 24px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--red);border-radius:3px}
.dlg .x{position:absolute;right:8px;top:8px;width:44px;height:44px;display:grid;place-items:center;font-size:1.1rem;z-index:5;background:rgba(13,14,17,.7);border-radius:50%}
.pdlg{display:grid}

.pitch{display:none}

.upl .pv[style*="min-height:70px"] img{height:auto;max-height:80px;object-fit:contain}

:root{
  --bg:#fff8fb; --surface:#ffffff; --raised:#fdeef5; --line:#f3d8e5;
  --chalk:#3b2a3a; --mute:#8a6f84;
  --red:#f6a5c8; --red-hot:#c23a7a; --red-deep:#e58bb4;
  --lav:#d6c8f8; --mint:#c4ecda; --peach:#ffd9c2; --sky:#cfe6ff; --ink:#4a1f38;
  --ok:#2f9e6b; --warn:#ffe29a;
  --display:'Fredoka','Figtree',system-ui,sans-serif;
  color-scheme:light;
}
.disp,.logo,.menu a,.pricechip b,.track span,.soldov,.price,.stat .num,.step .n,.bagt b,.adm-title,.fdlg h2,.adm-in h2{font-style:normal;text-transform:none;font-weight:600;letter-spacing:-.01em;line-height:1.05}
.disp{line-height:1}
.logo{font-size:2rem;font-weight:700}
.logo b{color:var(--red-hot)}
h2{font-size:clamp(2.1rem,6vw,3.4rem)}
.hero h1{font-size:clamp(3rem,13.5vw,6.4rem);line-height:.95}
.hero h1 .l2{color:var(--red-hot)}
.eyebrow,.kicker{color:var(--red-hot)}
.kicker::before{background:var(--red);transform:none;border-radius:3px}
.facts li::before{background:var(--red);transform:none;border-radius:50%}
.lead,.casa .body,.pinfo .desc{color:#5b4559}
.track span::after{opacity:.7}

/* botones redondos */
.btn{color:var(--ink);font-weight:700}
.btn::before{transform:none!important;border-radius:999px;background:var(--red);box-shadow:0 6px 16px rgba(214,100,150,.28);transition:background .18s,box-shadow .18s,translate .18s}
.btn:hover::before{background:#f893bd;translate:0 -2px}
.btn-ghost::before{background:#fff;box-shadow:inset 0 0 0 2px var(--red)}
.btn-ghost:hover::before{background:#ffeef6}
.btn-wa{color:#fff}
.btn-wa::before{background:#1b9a62;box-shadow:0 6px 16px rgba(27,154,98,.25)}
.btn-wa:hover::before{background:#16895a}
.btn-line{border-radius:999px;background:#fff}
.btn-danger{border-color:#e58bb4;color:var(--red-hot)}

/* cabecera */
.hdr{background:color-mix(in srgb,var(--bg) 88%,transparent)}
.nav a:hover{border-color:var(--red)}
.menu a{font-size:1.6rem}

/* inicio */
.hero{background:radial-gradient(60% 80% at 88% 30%,rgba(214,200,248,.65),transparent 70%),radial-gradient(50% 70% at 70% 90%,rgba(246,165,200,.45),transparent 70%),radial-gradient(40% 50% at 5% 10%,rgba(255,217,194,.55),transparent 70%)}
.hero-art::before{content:'';position:absolute;inset:4% 6%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,rgba(255,255,255,0) 62%),linear-gradient(145deg,var(--lav),var(--red));opacity:.8}
.hero-boot{filter:drop-shadow(0 22px 22px rgba(150,70,110,.28));--b-up:#f48fba;--b-acc:#fff;--b-inner:#8a4468;--b-lace:#fff}
.hero-photo{border-radius:28px;border-color:var(--line)}
.pricechip{background:#fff;color:var(--ink);clip-path:none;border-radius:999px;padding:10px 20px;box-shadow:0 8px 20px rgba(150,70,110,.2)}
.pricechip small{color:var(--mute)}

/* cinta */
.ticker{background:linear-gradient(90deg,var(--lav),var(--red),var(--peach));color:var(--ink)}

/* tarjetas */
.card{border-radius:22px;background:#fff;box-shadow:0 6px 22px rgba(190,110,150,.12);overflow:hidden;border-color:var(--line)}
.card:hover{border-color:var(--red);box-shadow:0 12px 30px rgba(190,110,150,.22)}
.card::after{background:var(--red-hot)}
.ph{background:radial-gradient(90% 70% at 30% 25%,hsl(var(--h) 85% 92%),transparent 72%),linear-gradient(160deg,#fff4f9,#f1e9ff);--b-up:hsl(var(--h) 78% 76%);--b-acc:#fff;--b-inner:#7d5a74;--b-lace:#fff}
.ph .boot{filter:drop-shadow(0 12px 12px rgba(150,70,110,.25))}
.tag{background:var(--lav);color:var(--ink);clip-path:none;border-radius:999px;left:10px;top:10px;padding:.35rem .8rem}
.soldov{background:rgba(255,255,255,.74);color:var(--ink)}
.price{color:var(--ink)}
.cbrand{color:var(--red-hot)}
.fbtn{border-radius:999px;background:#fff}
.fbtn em{background:var(--red-hot);color:#fff}
.chip{border-radius:999px;background:#fff}
.chip.on{background:var(--red);border-color:var(--red);color:var(--ink)}
.field{border-radius:14px;background:#fff}
.field:focus{border-color:var(--red-hot)}
.range,.check input,.tog input,.payo input{accent-color:var(--red-hot)}

/* secciones */
.rail-btns button{border-radius:50%;background:#fff}
.rail-btns button:hover{background:var(--red);border-color:var(--red)}
.tile{border-radius:24px;border-color:transparent;background:#ffe3ef;transition:transform .25s,box-shadow .25s}
.tile:nth-child(3n+2){background:#e8e0ff}
.tile:nth-child(3n){background:#d9f4e7}
.tile:hover{background:#ffd0e3;border-color:transparent;transform:translateY(-3px);box-shadow:0 12px 26px rgba(190,110,150,.2)}
.tile:nth-child(3n+2):hover{background:#dccfff}
.tile:nth-child(3n):hover{background:#c4ecda}
.tile .cnt,.tile .tb{color:#7a5a70}
.tile:hover .cnt,.tile:hover .tb{color:var(--ink)}
.tile .tboot{opacity:.45;--b-up:#fff;--b-acc:#fff;--b-inner:#fff;--b-lace:#fff}
.brands{background:#fff;border-color:var(--line)}
.brands .track span{-webkit-text-stroke:1px #e3a9c6}
.casa{background:linear-gradient(180deg,#fff0f7,#f4edff)}
.photo{border-radius:26px;border-color:#fff;box-shadow:0 10px 26px rgba(150,70,110,.15)}
.step{border-radius:24px;background:#fff;box-shadow:0 6px 18px rgba(190,110,150,.1)}
.step .n{color:var(--red-hot)}
.cta-band{border-radius:30px;background:linear-gradient(135deg,#f9b9d4,#d6c8f8)}

.cta-band p{color:#5b2f4a}
.cta-band .btn{color:#fff}
.cta-band .btn::before{background:var(--ink);box-shadow:none}
.cta-band .btn:hover::before{background:#33152a}
.cta-band .btn-ghost{color:var(--ink)}
.cta-band .btn-ghost::before{background:transparent;box-shadow:inset 0 0 0 2px var(--ink)}
.empty{border-radius:22px;border-color:#e8bad0}

/* pie, flotante y avisos */
.foot{background:#fff}
.foot .big{color:#fbe0ec}
.fab .btn{box-shadow:none}
.fab .btn::before{box-shadow:0 10px 22px rgba(120,60,90,.3)}
.toast{background:var(--ink);color:#fff;border-radius:999px;box-shadow:0 12px 30px rgba(74,31,56,.35)}
.editfab button{background:var(--ink);color:#fff}
.draftbar button{border-radius:999px}
.scrim{background:rgba(74,31,56,.42)}
.dlg{border-radius:28px;border-top:6px solid var(--red);box-shadow:0 20px 60px rgba(74,31,56,.3)}
.dlg .x{background:rgba(255,255,255,.9);color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.12)}
.pmedia{background:var(--raised)}
.pinfo .szh{color:var(--mute)}
.sizeerr .chips{outline-color:var(--red-hot)}

/* bolsa */
.bagp{border-left:6px solid var(--red);border-radius:28px 0 0 28px}
.bagn{background:var(--red-hot);color:#fff}
.bth{border-radius:14px}
.qty{border-radius:999px;overflow:hidden;background:#fff}
.qty button:hover{background:var(--raised)}
.bagf{background:#fff8fb}
.payo{border-radius:16px;background:#fff}
.payo:has(input:checked){border-color:var(--red-hot);background:#ffeaf3}
.ferr{color:#c0265f}

/* admin */
.adm{background:var(--bg)}
.adm-top,.adm-bar{background:#fff}

/* ===== Tipografía: serif editorial + sans geométrica ===== */
:root{--display:'Playfair Display','Bodoni Moda',Georgia,serif;--body:'Jost','Montserrat','Segoe UI',system-ui,sans-serif}
body{font-size:17px;letter-spacing:.005em}
.disp,.pricechip b,.stat .num,.step .n,.track span,.soldov,.menu a,.adm-title,.fdlg h2,.adm-in h2,h2,h3{font-variant-numeric:lining-nums;letter-spacing:-.02em}
.disp,h2{font-weight:600;line-height:1.05}

.price,.bagt b,.pricechip b{font-family:var(--body);font-weight:600;letter-spacing:-.01em}
.price{font-size:1.45rem}

.step h3,.fhead .disp{font-family:var(--display)}
.step h3{font-size:1.2rem;font-weight:600;letter-spacing:-.01em}

.bagh .disp,.bagp .bform h3{font-weight:600}

/* foto junto al texto */

/* ===== fondo rosa único (sin degradados de varios colores) ===== */

.hero-art::before{background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.75),rgba(255,255,255,0) 60%),var(--red);opacity:.75}

.casa{background:#fff0f6}
.cta-band{background:var(--red)}
.tile{background:#ffe3ef}
.tile:nth-child(3n+2){background:#fdd8e8}

/* ---------- carrusel de fotos y videos ---------- */
function isVid(s){return typeof s==='string'&&(s.indexOf('data:video/')===0||/^https?:\/\/\S+\.(mp4|webm|mov)(\?\S*)?$/i.test(s)||(/^videos\/[\w.-]+\.mp4#t=0\.001$/.test(s)))}
function slideOk(sl){return sl&&(isImg(sl.src)||isVid(sl.src))}
var vBlob={};
function vUrl(sl){
  var s=sl.src;if(s.indexOf('data:video/')!==0)return s;
  if(vBlob[s.length+':'+sl.id])return vBlob[s.length+':'+sl.id];
  try{var p=s.indexOf(','),mime=s.slice(5,s.indexOf(';')),bin=atob(s.slice(p+1)),n=bin.length,u=new Uint8Array(n);
    for(var i=0;i<n;i++)u[i]=bin.charCodeAt(i);
    return vBlob[s.length+':'+sl.id]=URL.createObjectURL(new Blob([u],{type:mime||'video/mp4'}))}catch(e){return s}
}
function slideMedia(sl){
  if(isVid(sl.src)){var u=vUrl(sl);return '<video class="sv" src="'+esc(u)+(u.indexOf('blob:')===0?'#t=0.001':'')+'" autoplay muted loop playsinline webkit-playsinline preload="auto" disablepictureinpicture disableremoteplayback tabindex="-1" aria-hidden="true"></video>';}
  return '<img src="'+sl.src+'" alt="'+esc(sl.cap||'')+'" loading="lazy" decoding="async" draggable="false">';
}

  return '<section class="sec car" id="carrusel"><div class="wrap">'+head+'<div class="carw"><div class="cartrack'+(a.length<3?' few':'')+'" id="car" tabindex="0" aria-label="Carrusel de fotos y videos">'+

  (a.length>1?'<button class="carb prev" data-act="car-go" data-d="-1" aria-label="Anterior">←</button><button class="carb next" data-act="car-go" data-d="1" aria-label="Siguiente">→</button>':'')+'</div></div></section>';
}
var carT=0,carTick=0,carHold=0;
function carGo(d,auto){
  var tr=$('#car');if(!tr)return;
  var sl=tr.querySelector('.cs');if(!sl)return;
  var step=sl.getBoundingClientRect().width+14;
  if(!auto)carHold=Date.now()+8000;
  var end=tr.scrollLeft+tr.clientWidth>=tr.scrollWidth-6;
  if(d>0&&end){if(tr.scrollWidth>tr.clientWidth+6)tr.scrollTo({left:0,behavior:'smooth'})}
  else if(d<0&&tr.scrollLeft<=6)tr.scrollTo({left:tr.scrollWidth,behavior:'smooth'});
  else tr.scrollBy({left:d*step,behavior:'smooth'});
}
function carPlayAll(){
  $$('#car video').forEach(function(v){
    v.muted=true;v.defaultMuted=true;v.loop=true;v.setAttribute('playsinline','');v.setAttribute('webkit-playsinline','');
    if(!v._h){v._h=1;['loadeddata','canplay','suspend','stalled'].forEach(function(ev){v.addEventListener(ev,function(){if(v.paused){var q=v.play();if(q&&q.catch)q.catch(function(){})}})});
      v.addEventListener('error',function(){var c=v.parentNode;if(c&&!c._r){c._r=1;var t=document.createElement('div');t.style.cssText='position:absolute;inset:0;display:grid;place-items:center;background:#fdeef5;color:#8a6f84;font-size:.9rem;text-align:center;padding:16px';t.textContent='Toca para ver el video';c.appendChild(t);c.addEventListener('click',function(){window.open(v.currentSrc||v.src,'_blank')})}})}
    if(v.paused){var pr=v.play();if(pr&&pr.catch)pr.catch(function(){})}
  });
}
['touchstart','pointerdown','click','scroll'].forEach(function(ev){document.addEventListener(ev,function(){carPlayAll()},{passive:true,capture:true})});
function carStart(){
  clearInterval(carT);carTick=0;
  var tr=$('#car');if(!tr)return;
  carPlayAll();
  ['pointerdown','touchstart','wheel','keydown'].forEach(function(ev){tr.addEventListener(ev,function(){carHold=Date.now()+8000},{passive:true})});
  carT=setInterval(function(){
    carPlayAll();
    carTick++;
    if(carTick%5===0&&Date.now()>carHold&&!document.hidden&&!matchMedia('(prefers-reduced-motion: reduce)').matches)carGo(1,true);
  },1000);
}
document.addEventListener('visibilitychange',function(){if(!document.hidden)carPlayAll()});

function bindCounters(){
  var els=$$('.num[data-n]');if(!els.length)return;
  if(matchMedia('(prefers-reduced-motion: reduce)').matches||!('IntersectionObserver' in window))return;
  var io=new IntersectionObserver(function(es){es.forEach(function(en){
    if(!en.isIntersecting)return;io.unobserve(en.target);
    var el=en.target,n=+el.dataset.n,t0=performance.now();
    var step=function(t){var k=Math.min(1,(t-t0)/900);el.textContent=Math.round(n*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(step)};
    requestAnimationFrame(step);
  })},{threshold:.4});
  els.forEach(function(e){io.observe(e)});
}

function saveForm(){

  var smin=Math.round(+$('#f-smin').value||0), smax=Math.round(+$('#f-smax').value||0);

  d.name=name;d.brand=$('#f-brand').value.trim()||'Sin marca';d.cat=$('#f-cat').value;d.price=price;d.old=Math.max(0,Math.round(+$('#f-old').value||0));

}
function fileToDataUrl(file,max,q){
  return new Promise(function(res,rej){
    var url=URL.createObjectURL(file),img=new Image();
    img.onload=function(){
      var w=img.naturalWidth,h=img.naturalHeight,k=Math.min(1,max/Math.max(w,h));
      w=Math.max(1,Math.round(w*k));h=Math.max(1,Math.round(h*k));
      var c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
      var out=c.toDataURL('image/webp',q);if(out.indexOf('data:image/webp')!==0)out=c.toDataURL('image/jpeg',q);
      URL.revokeObjectURL(url);res(out);
    };
    img.onerror=function(){URL.revokeObjectURL(url);rej(new Error('img'))};
    img.src=url;
  });
}
function applyBulk(){
  var scope=$('#bk-scope').value,mode=$('#bk-mode').value,v=+$('#bk-val').value;
  if(!(v>=0)||$('#bk-val').value===''){toast('Escribe el valor del ajuste.');return}
  var n=0;
  state.products.forEach(function(p){
    if(scope!=='all'&&p.cat!==scope)return;
    var np=mode==='set'?v:mode==='up'?p.price*(1+v/100):p.price*(1-v/100);
    np=Math.max(0,Math.round(np/1000)*1000);
    if(np!==p.price){p.price=np;n++}
  });
  if(n){touch();renderAdmin();toast('Precio actualizado en '+n+(n===1?' producto.':' productos.'))}
  else toast('Ningún precio cambió.');
}

/* ---------- publicar ---------- */
function buildHtml(st){
  var style=$('#app-style'),script=$('#app-script');
  if(!style||!script||!style.textContent||!script.textContent)throw new Error('source');
  var json=JSON.stringify(st).replace(/</g,'\\u003c');
  var close='</'+'script>';
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+RESET+'</style></head><body>'+
  '<title>T-Niss</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n'+FONT_LINK+'\n<style id="app-style">'+style.textContent+'</style>\n<div id="app"></div>\n<script id="state" type="application/json">'+json+close+'\n<script id="app-script">'+script.textContent+close+'\n</body></html>';
}
function publish(){
  if(busy||!dirty)return;
  if(!api){toast('Publicar no está disponible en esta vista. Abre la página con la cuenta del dueño.');return}
  var html;
  try{html=buildHtml(state)}catch(e){toast('No pude armar la página para publicar. Recárgala e inténtalo otra vez.');return}
  if(html.length>14*1048576){toast('La página pesa demasiado. Quita fotos o súbelas más livianas.');return}
  busy=true;var b=$('#adm-bar');if(b)b.innerHTML=barHtml();
  api.publish(html).then(function(){toast('Publicado. Actualizando la tienda…')}).catch(function(e){
    busy=false;var b2=$('#adm-bar');if(b2)b2.innerHTML=barHtml();
    var c=e&&e.code;
    if(c==='conflict')toast('Alguien publicó antes que tú. La página se está recargando con la última versión.');
    else if(c==='not_writer'||c==='not_granted'||c==='consent_required')toast('Esta cuenta no tiene permiso para publicar.');
    else if(c==='too_large')toast('La página pesa demasiado. Quita fotos o súbelas más livianas.');
    else if(c==='rate_limited')toast('Publicaste muy seguido. Espera un momento.');
    else toast('No se pudo publicar. Inténtalo de nuevo.');
  });
}
function discard(){
  state=JSON.parse(savedJson);dirty=0;adm.edit=null;
  if(!admEl.hidden)renderAdmin();else render();
  toast('Cambios descartados.');
}

  else if(a==='guide-close'){var gv=$('.gov',layer);if(gv)gv.remove()}
  else if(a==='fav'){

    favSave();syncFav();if(view.fav)updateCatalog(true);
  }
  else if(a==='fav-open'){if(!layer.hidden)closeLayer();if(!bagEl.hidden)closeBag();openFav()}
  else if(a==='fav-close')closeFav();
  else if(a==='fav-drawer'){
    var fj=favs.indexOf(id);if(fj<0)favs.push(id);else favs.splice(fj,1);
    favSave();syncFav();var fl=$('.bagl',favEl),st0=fl?fl.scrollTop:0;favEl.innerHTML=favDrawerHtml();
  }
  else if(a==='q-all'){view.tag='';view.fav=false;updateCatalog(true)}
  else if(a==='q-tag'){view.tag=view.tag===v?'':v;view.fav=false;updateCatalog(true)}
  
  else if(a==='close-layer')closeLayer();
  else if(a==='bag-open'){if(!layer.hidden)closeLayer();openBag()}
  else if(a==='admin-force'){closeLayer();openAdmin()}
  else if(a==='bag-close')closeBag();
  else if(a==='bag-send'){
    if(Object.keys(formErrors()).length){ev.preventDefault();showFormErrors()}
    else{bagErr={};syncSend()}
  }
  else if(a==='add-bag'){
    if(!modal.sel){toast('Elige tu talla primero.');var pi=$('.pinfo',layer);if(pi){pi.classList.add('sizeerr');setTimeout(function(){pi.classList.remove('sizeerr')},1800)}return}
    addToBag(id,modal.sel);closeLayer();toast('Agregado a tu bolsa.');
  }
  else if(a==='qty'){var ix=+t.dataset.i,it=cart[ix];if(it){it.qty+=(+t.dataset.d);if(it.qty<1)cart.splice(ix,1);else if(it.qty>9)it.qty=9;cartSave();updateBagUi()}}
  else if(a==='bag-del'){cart.splice(+t.dataset.i,1);cartSave();updateBagUi()}
  else if(a==='bag-clear'){cart=[];cartSave();updateBagUi()}
  else if(a==='pick-size'){
    var p=byId(modal.id);if(!p)return;modal.sel=+t.dataset.s;
    $('#szc').innerHTML=sizeChips(p);var ab=$('[data-act="add-bag"] span',layer);if(ab)ab.textContent='Agregar talla '+szl(p,modal.sel)+' a la bolsa';$('#szl').textContent='Talla '+szl(p,modal.sel);$('#pwa').href=waUrl(pMsg(p));
  }
  else if(a==='tile'){view.cat=v;view.open=false;updateCatalog(false);var c=$('#coleccion');if(c)c.scrollIntoView({behavior:'smooth'})}
  else if(a==='f-cat'){view.cat=v;updateCatalog(false)}
  else if(a==='f-brand'){var i=view.brands.indexOf(v);if(i<0)view.brands.push(v);else view.brands.splice(i,1);updateCatalog(false)}
  else if(a==='more'){view.limit+=48;updateCatalog(true)}
  else if(a==='f-size'){var s=+v;view.size=view.size===s?null:s;updateCatalog(false)}
  else if(a==='f-clear'){view.cat='all';view.brands=[];view.size=null;view.maxPrice=null;view.avail=false;view.q='';view.tag='';view.fav=false;var q=$('#f-q');if(q)q.value='';updateCatalog(false)}
  else if(a==='f-open'){view.open=true;updateCatalog(true)}
  else if(a==='f-close'){view.open=false;updateCatalog(true)}
  else if(a==='admin-entry'){if(canAdmin)openAdmin();else openLoginInfo()}
  else if(a==='adm-open')openAdmin();
  else if(a==='adm-close')closeAdmin();
  else if(a==='adm-tab'){adm.tab=v;renderAdmin()}
  else if(a==='adm-new')openForm(null);
  else if(a==='adm-edit')openForm(id);
  else if(a==='form-close'){adm.edit=null;$('#adm-modal').innerHTML=''}
  else if(a==='form-save')saveForm();
  else if(a==='form-img-del'){if(adm.edit){adm.edit.d.img='';$('#f-pv-img').innerHTML='<div class="ph mini" style="--h:'+hueOf(adm.edit.d.id||'new')+'">'+bootSvg()+'</div>'}}
  else if(a==='form-del'){
    if(t.dataset.arm==='1'){
      state.products=state.products.filter(function(p){return p.id!==adm.edit.id});
      adm.edit=null;$('#adm-modal').innerHTML='';touch();renderAdmin();toast('Producto eliminado. Falta publicar.');
    }else{t.dataset.arm='1';t.textContent='Toca otra vez para eliminar';setTimeout(function(){if(t.isConnected){t.dataset.arm='';t.textContent='Eliminar producto'}},3500)}
  }
  else if(a==='bk-apply')applyBulk();
  else if(a==='cat-add'){
    var inp=$('#cat-new'),nm=inp.value.trim();if(!nm){toast('Escribe el nombre de la sección.');return}
    var slug=nm.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'seccion';
    if(state.cats.some(function(c){return c.id===slug}))slug+='-'+Date.now().toString(36).slice(-3);
    state.cats.push({id:slug,name:nm,blurb:''});touch();renderAdmin();
  }
  else if(a==='cat-del'){var ci=+t.dataset.i;state.cats.splice(ci,1);touch();renderAdmin()}
  else if(a==='photo-del'){state.settings[t.dataset.k]='';touch();renderAdmin()}
  else if(a==='hp-open'){adm.tab='fotos';openAdmin();var pc=$('.poscard',admEl);if(pc)pc.scrollIntoView({block:'start'})}
  else if(a==='hp-center'){var hk=t.dataset.k;state.settings[hk+'X']=50;state.settings[hk+'Y']=50;state.settings[hk+'Z']=100;touch();renderAdmin()}
  else if(a==='car-open'){adm.tab='car';openAdmin()}
  else if(a==='car-go')carGo(+t.dataset.d,false);
  else if(a==='sl-up'||a==='sl-down'){var si=+t.dataset.i,sj=si+(a==='sl-up'?-1:1);if(state.slides[sj]){var tmp=state.slides[si];state.slides[si]=state.slides[sj];state.slides[sj]=tmp;touch();renderAdmin()}}
  else if(a==='sl-del'){state.slides.splice(+t.dataset.i,1);touch();renderAdmin()}
  else if(a==='sl-url'){var su=$('#sl-url'),uv=su?su.value.trim():'';if(!isVid(uv)){toast('Pega un enlace directo a un archivo de video (termina en .mp4 o .webm).');return}addSlide(uv);touch();renderAdmin();toast('Video agregado. Falta publicar.')}
  else if(a==='adm-publish')publish();
  else if(a==='adm-discard')discard();
});
document.addEventListener('submit',function(ev){if(ev.target.id==='bag-form')ev.preventDefault()});
document.addEventListener('input',function(ev){
  var t=ev.target;
  if(t.id==='f-q'){view.q=t.value.trim();updateCatalog(true)}
  else if(t.id==='f-price'){var mp=maxPriceAll(),val=+t.value;view.maxPrice=val>=mp?null:val;var pv=$('#f-pv');if(pv)pv.textContent=money(val);updateCatalog(true)}
  else if(t.dataset&&t.dataset.hp){var hv=+t.value,hax=t.dataset.hp;state.settings[t.dataset.k+hax]=(hax==='Z')?hv:(100-hv);hpApply(t.dataset.k);touch()}
  else if(t.id==='adm-q'){adm.q=t.value;var l=$('#alist');if(l)l.innerHTML=admList()}
  else if(t.dataset&&t.dataset.bf&&t.type!=='radio'){
    bagForm[t.dataset.bf]=t.value;formSave();syncSend();
    if(bagErr[t.dataset.bf]){delete bagErr[t.dataset.bf];var lb=t.closest('.bf');if(lb)lb.classList.remove('bad');t.setAttribute('aria-invalid','false');var er=$('[data-err="'+t.dataset.bf+'"]',lb||document);if(er)er.hidden=true}
  }
});
document.addEventListener('change',function(ev){
  var t=ev.target;
  if(t.dataset&&t.dataset.bf==='pay'){bagForm.pay=t.value;formSave();syncSend();delete bagErr.pay;var pf=t.closest('.pay');if(pf){pf.classList.remove('bad');var er=$('[data-err="pay"]',pf);if(er)er.hidden=true}return}
  if(t.id==='f-sort'){view.sort=t.value;updateCatalog(true)}
  else if(t.id==='f-avail'){view.avail=t.checked;updateCatalog(false)}
  else if(t.id==='f-file'){
    var f=t.files&&t.files[0];if(!f||!adm.edit)return;
    var note=$('#f-img-note');if(note)note.textContent='Procesando foto…';
    fileToDataUrl(f,1000,.82).then(function(u){adm.edit.d.img=u;$('#f-pv-img').innerHTML='<img src="'+u+'" alt="">';if(note)note.textContent='Foto lista ('+Math.round(u.length*.75/1024)+' KB).'}).catch(function(){if(note)note.textContent='No pude leer esa foto. Prueba con otra.'});
  }
  else if(t.dataset&&t.dataset.ch){
    var ch=t.dataset.ch,id=t.dataset.id,p=id?byId(id):null;
    if(ch==='price'&&p){p.price=Math.max(0,Math.round(+t.value||0));touch();toast('Precio de “'+p.name+'”: '+money(p.price))}
    else if(ch==='feat'&&p){p.featured=t.checked;touch()}
    else if(ch==='sold'&&p){p.soldout=t.checked;touch()}
    else if(ch==='cname'){state.cats[+t.dataset.i].name=t.value.trim()||state.cats[+t.dataset.i].name;touch()}
    else if(ch==='cblurb'){state.cats[+t.dataset.i].blurb=t.value.trim();touch()}
    else if(ch==='set'){state.settings[t.dataset.k]=t.value;touch()}
    else if(ch==='setlines'){state.settings[t.dataset.k]=lines(t.value);touch()}
    else if(ch==='slcap'){var sc=state.slides[+t.dataset.i];if(sc){sc.cap=t.value.trim();touch()}}
    else if(ch==='slimg'){
      var fl=Array.prototype.slice.call(t.files||[]);if(!fl.length)return;toast('Procesando '+(fl.length>1?'fotos…':'foto…'));
      Promise.all(fl.map(function(ff){return fileToDataUrl(ff,1200,.85).catch(function(){return null})})).then(function(us){
        var n=0;us.forEach(function(u){if(u){addSlide(u);n++}});
        if(n){touch();renderAdmin();toast(n+(n===1?' foto agregada.':' fotos agregadas.')+' Falta publicar.')}else toast('No pude leer esas fotos. Prueba con otras.');
      });
    }
    else if(ch==='slvid'){
      var vf=t.files&&t.files[0];if(!vf)return;
      var mb=vf.size/1048576;
      if(mb>8){toast('Ese video pesa '+mb.toFixed(1)+' MB. Usa uno más corto, de menos de 8 MB, o pega un enlace.');t.value='';return}
      toast('Cargando video…');
      readVideo(vf).then(function(u){
        if(u.indexOf('data:video/')!==0)u='data:video/mp4'+u.slice(u.indexOf(';'));
        addSlide(u);touch();renderAdmin();
        toast(sizeMB()>12?'Video agregado, pero la página ya pesa '+sizeMB().toFixed(1)+' MB de 14. Quita algo antes de publicar.':'Video agregado. Falta publicar.');
      }).catch(function(){toast('No pude leer ese video. Prueba con otro.')});
    }
    else if(ch==='photo'){
      var f2=t.files&&t.files[0];if(!f2)return;var k=t.dataset.k;
      toast('Procesando foto…');
      fileToDataUrl(f2,k==='heroImg'?1400:(k==='logo'?700:1000),.9).then(function(u){state.settings[k]=u;var hk2=k==='heroImg'?'hero':(k==='heroImg2'?'hero2':'');if(hk2){state.settings[hk2+'X']=50;state.settings[hk2+'Y']=50;state.settings[hk2+'Z']=100}touch();if(admEl.hidden)render();else renderAdmin();toast('Foto lista. Toca “Publicar cambios” para que la vean tus clientas.')}).catch(function(){toast('No pude leer esa foto. Prueba con otra.')});
    }
  }
});
